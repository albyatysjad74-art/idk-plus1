name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary & IPA
        run: |
          mkdir -p Payload/idkPlus.app
          mkdir -p build_objs
          mkdir -p build_zsign_objs
          mkdir -p App

          # 1. إنشاء ملف الترويسة للجسر
          cat << 'EOF' > App/ZSignBridge.h
          #import <Foundation/Foundation.h>

          @interface ZSignBridge : NSObject
          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath;
          @end
          EOF

          # 2. إنشاء الجسر البرمجي باستدعاء أداة zsign المدمجة
          cat << 'EOF' > App/ZSignBridge.mm
          #import "ZSignBridge.h"
          #import <Foundation/Foundation.h>
          #include <spawn.h>
          #include <sys/wait.h>
          #include <vector>

          @implementation ZSignBridge

          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath {

              NSString *zsignBin = [[NSBundle mainBundle] pathForResource:@"zsign" ofType:nil];
              if (!zsignBin || ![[NSFileManager defaultManager] fileExistsAtPath:zsignBin]) {
                  zsignBin = [[[NSBundle mainBundle] bundlePath] stringByAppendingPathComponent:@"zsign"];
              }

              NSMutableArray *args = [NSMutableArray array];
              [args addObject:@"zsign"];
              [args addObject:@"-k"];
              [args addObject:p12Path];
              [args addObject:@"-m"];
              [args addObject:provPath];
              [args addObject:@"-o"];
              [args addObject:outputPath];

              if (password && password.length > 0) {
                  [args addObject:@"-p"];
                  [args addObject:password];
              }

              [args addObject:ipaPath];

              std::vector<const char*> c_args;
              for (NSString *arg in args) {
                  c_args.push_back([arg UTF8String]);
              }
              c_args.push_back(NULL);

              pid_t pid;
              int status;
              if (posix_spawn(&pid, [zsignBin UTF8String], NULL, NULL, (char* const*)c_args.data(), NULL) == 0) {
                  waitpid(pid, &status, 0);
                  return WEXITSTATUS(status) == 0;
              }
              return NO;
          }

          @end
          EOF

          # 3. ترجمة ملفات C لـ minizip بمترجم C الصريح واستبعاد mztools و win32
          echo "Compiling C files with clang (C)..."
          C_FILES=$(find vendor/zsign -name "*.c" ! -name "*win32*" ! -name "*iowin32*" ! -name "*mztools*")
          for file in $C_FILES; do
            xcrun -sdk iphoneos clang -c "$file" \
              -I vendor/openssl/include \
              -I vendor/zsign \
              -I vendor/zsign/common \
              -I vendor/zsign/third-party \
              -target arm64-apple-ios16.0 \
              -w \
              -o "build_zsign_objs/$(basename "$file" .c).o"
          done

          # 4. ترجمة ملفات C++ لـ zsign
          echo "Compiling C++ files with clang++..."
          CPP_FILES=$(find vendor/zsign -name "*.cpp")
          for file in $CPP_FILES; do
            xcrun -sdk iphoneos clang++ -c "$file" \
              -I vendor/openssl/include \
              -I vendor/zsign \
              -I vendor/zsign/common \
              -I vendor/zsign/third-party \
              -target arm64-apple-ios16.0 \
              -std=c++11 \
              -w \
              -o "build_zsign_objs/$(basename "$file" .cpp).o"
          done

          # 5. ربط أداة zsign المستقلة
          echo "Linking standalone zsign binary..."
          xcrun -sdk iphoneos clang++ build_zsign_objs/*.o \
            -L vendor/openssl \
            -lcrypto -lssl -lz \
            -target arm64-apple-ios16.0 \
            -o Payload/idkPlus.app/zsign

          chmod +x Payload/idkPlus.app/zsign

          # 6. ترجمة ملف الجسر ZSignBridge
          echo "Compiling ZSignBridge..."
          xcrun -sdk iphoneos clang++ -c App/ZSignBridge.mm \
            -I App \
            -target arm64-apple-ios16.0 \
            -std=c++11 \
            -w \
            -o build_objs/ZSignBridge.o

          # 7. جرد ملفات Swift
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          # 8. ترجمة وربط تطبيق Swift مع الواجهة
          echo "Linking binary with Swift..."
          xcrun -sdk iphoneos swiftc $SWIFT_FILES build_objs/ZSignBridge.o \
            -target arm64-apple-ios16.0 \
            -import-objc-header App/ZSignBridge.h \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          chmod +x Payload/idkPlus.app/idkPlus

          # 9. نسخ الملفات التعريفية والأيقونات
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/idkPlus.app/Info.plist
          fi

          find . -name "Logo.png" -exec cp {} Payload/idkPlus.app/Logo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/Lokgojo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/AppIcon.png \;

          # 10. ضغط حزمة التطبيق النهائية
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa