name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary & IPA
        run: |
          mkdir -p Payload/idkPlus.app

          # البحث عن ملفات Swift الخاصة بالمتجر وتجميعها
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          # ترجمة الكود إلى ملف تنفيذي أصلي لمعمارية الآيفون arm64
          xcrun -sdk iphoneos swiftc $SWIFT_FILES \
            -target arm64-apple-ios15.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          # ضبط صلاحيات التشغيل للملف الثنائي
          chmod +x Payload/idkPlus.app/idkPlus

          # نسخ الصور إلى داخل حزمة التطبيق لتظهر في البداية وكأيقونة
          cp App/Logo.png Payload/idkPlus.app/ 2>/dev/null || cp Logo.png Payload/idkPlus.app/ 2>/dev/null || true
          cp App/Lokgojo.png Payload/idkPlus.app/ 2>/dev/null || cp Lokgojo.png Payload/idkPlus.app/ 2>/dev/null || true

          # إنشاء ملف Info.plist الرسمي شاملاً تعريف أيقونة Lokgojo
          cat << 'EOF' > Payload/idkPlus.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>idkPlus</string>
              <key>CFBundleIdentifier</key>
              <string>com.idk.plus</string>
              <key>CFBundleName</key>
              <string>idk Plus</string>
              <key>CFBundleDisplayName</key>
              <string>idk Plus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>Lokgojo.png</string>
                          <string>Lokgojo</string>
                      </array>
                      <key>UIPrerenderedIcon</key>
                      <true/>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF

          # حزم التطبيق بصيغة IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa