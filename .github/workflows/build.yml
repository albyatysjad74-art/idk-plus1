name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary & IPA
        run: |
          mkdir -p Payload/idkPlus.app

          # البحث عن ملفات Swift وتجميعها
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          # ترجمة الكود التنفيذي ليعمل على iOS 16.0 فما فوق
          xcrun -sdk iphoneos swiftc $SWIFT_FILES \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          # ضبط صلاحيات التشغيل
          chmod +x Payload/idkPlus.app/idkPlus

          # نسخ ملف Info.plist الجاهز
          cp Info.plist Payload/idkPlus.app/Info.plist

          # نسخ الصور إلى داخل حزمة التطبيق
          cp App/Logo.png Payload/idkPlus.app/ 2>/dev/null || cp Logo.png Payload/idkPlus.app/ 2>/dev/null || true
          cp App/Lokgojo.png Payload/idkPlus.app/ 2>/dev/null || cp Lokgojo.png Payload/idkPlus.app/ 2>/dev/null || true

          # إنشاء ملف الـ IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa