name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build iOS IPA
        run: |
          mkdir -p Payload/idkPlus.app

          # استبعاد ملفات الشهادات القديمة تلقائياً لتفادي أي تعارض أثناء الترجمة
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*" ! -name "CertificateSectionView.swift" ! -name "DownloadManager.swift")
          echo "Found Swift files to compile:"
          echo "$SWIFT_FILES"

          # ترجمة وربط تطبيق Swift فقط
          xcrun -sdk iphoneos swiftc $SWIFT_FILES \
            -target arm64-apple-ios16.0 \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          chmod +x Payload/idkPlus.app/idkPlus

          # نسخ ملف التعريف والأيقونات
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/idkPlus.app/Info.plist
          fi

          find . -name "Logo.png" -exec cp {} Payload/idkPlus.app/Logo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/Lokgojo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/AppIcon.png \;

          # ضغط الحزمة إلى ملف IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa
