name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary & IPA
        run: |
          mkdir -p Payload/idkPlus.app
          mkdir -p build_objs
          mkdir -p App

          # استبعاد ملف zsign.cpp فقط حتى لا يحصل تضارب في دالة main مع Swift
          rm -f vendor/zsign/zsign.cpp

          # 1. إنشاء ملف الترويسة للجسر
          cat << 'EOF' > App/ZSignBridge.h
          #import <Foundation/Foundation.h>

          @interface ZSignBridge : NSObject
          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath;
          @end
          EOF

          # 2. إنشاء الجسر البرمجي باستخدام ZBundle و ZSignAsset الأصلية
          cat << 'EOF' > App/ZSignBridge.mm
          #import "ZSignBridge.h"
          #import <Foundation/Foundation.h>
          #include <iostream>
          #include <string>
          #include "bundle.h"

          @implementation ZSignBridge

          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath {

              std::string strIPA = [ipaPath UTF8String];
              std::string strP12 = [p12Path UTF8String];
              std::string strProv = [provPath UTF8String];
              std::string strPass = password ? [password UTF8String] : "";
              std::string strOut = [outputPath UTF8String];

              ZSignAsset zAsset;
              if (!zAsset.Init("", strP12, strProv, strPass, "")) {
                  return NO;
              }

              ZBundle zBundle;
              bool success = zBundle.SignFolder(&zAsset, strIPA, "", "", "", "", false, false, false, false);
              return success ? YES : NO;
          }

          @end
          EOF

          # 3. ترجمة ملفات C الخاصة بـ minizip بدون ملفات ويندوز
          echo "Compiling POSIX C files (minizip)..."
          C_FILES=$(find vendor/zsign -name "*.c" ! -name "*win32*" ! -name "*iowin32*")
          if [ -n "$C_FILES" ]; then
            xcrun -sdk iphoneos clang -c $C_FILES \
              -I vendor/openssl/include \
              -I vendor/zsign \
              -I vendor/zsign/common \
              -I vendor/zsign/third-party \
              -target arm64-apple-ios16.0 \
              -w
            mv *.o build_objs/ 2>/dev/null || true
          fi

          # 4. ترجمة ملفات C++ لـ zsign
          echo "Compiling C++ files..."
          CPP_FILES=$(find vendor/zsign -name "*.cpp")
          xcrun -sdk iphoneos clang++ -c $CPP_FILES \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -target arm64-apple-ios16.0 \
            -std=c++11 \
            -w
          mv *.o build_objs/ 2>/dev/null || true

          # 5. ترجمة ملف الجسر ZSignBridge
          echo "Compiling ZSignBridge..."
          xcrun -sdk iphoneos clang++ -c App/ZSignBridge.mm \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -I App \
            -target arm64-apple-ios16.0 \
            -std=c++11 \
            -w \
            -o build_objs/ZSignBridge.o

          # 6. جرد ملفات Swift
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          # 7. التجميع النهائي والربط (Linker)
          echo "Linking binary with Swift..."
          xcrun -sdk iphoneos swiftc $SWIFT_FILES build_objs/*.o \
            -target arm64-apple-ios16.0 \
            -import-objc-header App/ZSignBridge.h \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -L vendor/openssl \
            -lcrypto -lssl -lz -lc++ \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          chmod +x Payload/idkPlus.app/idkPlus

          # 8. نسخ الملفات التعريفية والأيقونات
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/idkPlus.app/Info.plist
          fi

          find . -name "Logo.png" -exec cp {} Payload/idkPlus.app/Logo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/Lokgojo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/AppIcon.png \;

          # 9. إنشاء حزمة IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa