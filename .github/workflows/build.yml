name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary & IPA
        run: |
          mkdir -p Payload/idkPlus.app
          mkdir -p build_objs
          mkdir -p App

          # إنشاء ملف الجسر Header
          cat << 'EOF' > App/ZSignBridge.h
          #import <Foundation/Foundation.h>

          @interface ZSignBridge : NSObject
          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath;
          @end
          EOF

          # تعديل أي دالة main لتصبح zsign_main في كل ملفات المشروع
          find vendor/zsign -type f \( -name "*.cpp" -o -name "*.c" \) -exec sed -i '' -E 's/\bint[[:space:]]+main[[:space:]]*\(/int zsign_main(/g' {} +

          # إنشاء كود الجسر Objective-C++
          cat << 'EOF' > App/ZSignBridge.mm
          #import "ZSignBridge.h"
          #import <Foundation/Foundation.h>
          #include <vector>
          #include <string>

          extern "C" int zsign_main(int argc, char* argv[]);
          // في حال كانت الدالة بتنسيق C++ بدون extern C
          int zsign_main(int argc, char* argv[]) __attribute__((weak));

          @implementation ZSignBridge

          + (BOOL)signIPA:(NSString *)ipaPath
                  p12Path:(NSString *)p12Path
                 provPath:(NSString *)provPath
                 password:(NSString *)password
               outputPath:(NSString *)outputPath {

              std::vector<std::string> args = {
                  "zsign",
                  "-k", [p12Path UTF8String],
                  "-m", [provPath UTF8String],
                  "-o", [outputPath UTF8String]
              };

              if (password && [password length] > 0) {
                  args.push_back("-p");
                  args.push_back([password UTF8String]);
              }

              args.push_back([ipaPath UTF8String]);

              std::vector<char*> c_args;
              for (auto& arg : args) {
                  c_args.push_back(&arg[0]);
              }

              if (zsign_main) {
                  int result = zsign_main((int)c_args.size(), c_args.data());
                  return result == 0;
              }
              return NO;
          }

          @end
          EOF

          # 1. ترجمة ملفات C مع استبعاد ملفات Windows
          echo "Compiling POSIX C files (minizip)..."
          C_FILES=$(find vendor/zsign -name "*.c" ! -name "*win32*" ! -name "*iowin32*")
          if [ -n "$C_FILES" ]; then
            xcrun -sdk iphoneos clang -c $C_FILES \
              -I vendor/openssl/include \
              -I vendor/zsign \
              -I vendor/zsign/common \
              -I vendor/zsign/third-party \
              -target arm64-apple-ios16.0 \
              -w
            mv *.o build_objs/ 2>/dev/null || true
          fi

          # 2. ترجمة ملفات C++ لـ zsign
          echo "Compiling C++ files..."
          CPP_FILES=$(find vendor/zsign -name "*.cpp")
          xcrun -sdk iphoneos clang++ -c $CPP_FILES \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -target arm64-apple-ios16.0 \
            -std=c++11 \
            -w
          mv *.o build_objs/ 2>/dev/null || true

          # 3. ترجمة ملف الجسر
          echo "Compiling ZSignBridge..."
          xcrun -sdk iphoneos clang++ -c App/ZSignBridge.mm \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -I App \
            -target arm64-apple-ios16.0 \
            -std=c++11 \
            -w \
            -o build_objs/ZSignBridge.o

          # 4. جمع ملفات Swift
          SWIFT_FILES=$(find . -maxdepth 4 -name "*.swift" ! -name "Package.swift" ! -path "*/.*/*" ! -path "*/test/*")
          echo "Found Swift files:"
          echo "$SWIFT_FILES"

          # 5. التجميع النهائي والربط
          echo "Linking binary with Swift..."
          xcrun -sdk iphoneos swiftc $SWIFT_FILES build_objs/*.o \
            -target arm64-apple-ios16.0 \
            -import-objc-header App/ZSignBridge.h \
            -I vendor/openssl/include \
            -I vendor/zsign \
            -I vendor/zsign/common \
            -I vendor/zsign/third-party \
            -L vendor/openssl \
            -lcrypto -lssl -lz -lc++ \
            -parse-as-library \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit

          chmod +x Payload/idkPlus.app/idkPlus

          # 6. نسخ Info.plist والأيقونات
          if [ -f "Info.plist" ]; then
            cp Info.plist Payload/idkPlus.app/Info.plist
          fi

          find . -name "Logo.png" -exec cp {} Payload/idkPlus.app/Logo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/Lokgojo.png \;
          find . -name "Lokgojo.png" -exec cp {} Payload/idkPlus.app/AppIcon.png \;

          # 7. ضغط الـ IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA File
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa