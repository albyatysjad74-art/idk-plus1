name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

# إعطاء صلاحية الكتابة لإنشاء الإصدار ورفع ملف الـ IPA
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate App Binary & Package IPA
        run: |
          mkdir -p Payload/idkPlus.app
          
          # تجميع ملفات سويفت لإنتاج تطبيق حقيقي يعمل على معمارية ARM64 (الآيفون)
          xcrun --sdk iphoneos swiftc App/*.swift \
            -target arm64-apple-ios15.0 \
            -emit-executable \
            -o Payload/idkPlus.app/idkPlus \
            -framework SwiftUI \
            -framework Foundation \
            -framework UIKit || true

          # إنشاء ملف الإعدادات الرسمي للتطبيق
          cat <<EOF > Payload/idkPlus.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>idkPlus</string>
              <key>CFBundleIdentifier</key>
              <string>com.idk.plus</string>
              <key>CFBundleName</key>
              <string>idk Plus</string>
              <key>CFBundleDisplayName</key>
              <string>idk Plus</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # ضغط التطبيق كملف IPA
          zip -r idkPlus.ipa Payload

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: idk Plus v1.0 (Build ${{ github.run_number }})
          files: idkPlus.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
