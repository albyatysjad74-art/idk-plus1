name: Build idk Plus IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Real iOS Binary
        run: |
          # بناء التطبيق كملف تنفيذي حقيقي لمعمارية الآيفون
          swift build -c release --triple arm64-apple-ios15.0

          # إنشاء مجلدات الحزمة الرسمية
          mkdir -p Payload/idkPlus.app

          # نسخ الملف التنفيذي المترجم إلى قلب الحزمة
          cp .build/arm64-apple-ios15.0/release/idkPlus Payload/idkPlus.app/idkPlus
          chmod +x Payload/idkPlus.app/idkPlus

          # إنشاء ملف Info.plist الرسمي بالبندل والاسم المطلوب
          cat << 'EOF' > Payload/idkPlus.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>idkPlus</string>
              <key>CFBundleIdentifier</key>
              <string>com.idk.plus</string>
              <key>CFBundleName</key>
              <string>idk Plus</string>
              <key>CFBundleDisplayName</key>
              <string>idk Plus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

          # ضغط الملف بصيغة IPA
          zip -qry idkPlus.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: idkPlus-IPA
          path: idkPlus.ipa